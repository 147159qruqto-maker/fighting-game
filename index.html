<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>格斗游戏 · 街机擂台</title>
<style>
  :root{
    --bg:#080a14; --panel:#14192e; --panel2:#1d2442; --ink:#f2f4ff; --muted:#a7b0cf;
    --red:#ff3b5c; --red-d:#b91f3e; --blue:#3b82f6; --blue-d:#1d4fb8;
    --gold:#ffc53d; --gold-d:#d99a12; --green:#2ee6a8; --line:#2e3860; --line-soft:#232c4e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink);
    background:
      radial-gradient(900px 500px at 50% -10%, #1d2550 0%, transparent 60%),
      radial-gradient(700px 400px at 85% 110%, #2a1430 0%, transparent 55%),
      var(--bg);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #app{display:flex; flex-direction:column; height:100dvh; max-width:1100px; margin:0 auto;}

  /* ---------- HUD ---------- */
  #hud{padding:12px 12px 8px; display:none;}
  #hud.on{display:block;}
  .hud-row{display:flex; align-items:flex-start; gap:12px;}
  .side{flex:1; min-width:0;}
  .side.right{text-align:right;}
  .name{font-size:13px; font-weight:800; letter-spacing:.08em; margin-bottom:6px; display:flex; align-items:center; gap:7px; text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .side.right .name{justify-content:flex-end;}
  .pips{display:inline-flex; gap:5px;}
  .pip{width:11px; height:11px; border-radius:50%; border:2px solid rgba(255,197,61,.85); background:rgba(0,0,0,.35); box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  .pip.won{background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold) 55%, var(--gold-d)); border-color:#ffe9a8; box-shadow:0 0 8px rgba(255,197,61,.65);}
  .bar{height:18px; background:#04060d; border:1px solid #3a4470; border-radius:6px; overflow:hidden; position:relative;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85), inset 0 -1px 0 rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.05);}
  .bar::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.04) 38%, transparent 55%); pointer-events:none; z-index:3;}
  .bar .fill{height:100%; width:100%; transition:width .18s ease-out; position:relative; z-index:2;}
  .bar .ghost{position:absolute; inset:0; background:linear-gradient(90deg,#e8e2d0,#fff8e6); opacity:.75; transition:width .7s ease .25s; z-index:1;}
  .side.right .bar{direction:rtl;}
  #hp1{background:linear-gradient(90deg,#8f1530,var(--red-d) 30%,var(--red) 75%,#ff6b85);}
  #hp2{background:linear-gradient(90deg,#5ea0ff,var(--blue) 25%,var(--blue-d) 70%,#123f8f);}
  .ebar{height:8px; margin-top:5px; background:#04060d; border:1px solid var(--line-soft); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 4px rgba(0,0,0,.8);}
  .ebar .fill{height:100%; width:0%; background:linear-gradient(90deg,#e07f13,#ffb347 45%,var(--gold)); transition:width .12s; border-radius:99px;}
  .ebar.full{border-color:rgba(255,197,61,.7); box-shadow:0 0 10px rgba(255,197,61,.35), inset 0 1px 4px rgba(0,0,0,.6);}
  .ebar.full .fill{background:linear-gradient(90deg,#ffd34d,#fff0a8,#ffe27a); }
  #timer{
    width:62px; flex:none; text-align:center; background:linear-gradient(180deg,#1e2748,#11172e);
    border:1px solid #3a4470; border-radius:10px; padding:6px 0 6px;
    box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09);
  }
  #timer .t{font-size:27px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.02em; text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #timer .l{font-size:10px; color:var(--muted); letter-spacing:.28em; margin-top:3px; font-weight:700;}
  #timer.low{border-color:rgba(255,59,92,.7);}
  #timer.low .t{color:#ff5d78; animation:tpulse .5s ease-in-out infinite alternate;}
  @keyframes tpulse{from{transform:scale(1)}to{transform:scale(1.08)}}

  /* ---------- Stage ---------- */
  #stage-wrap{position:relative; flex:1; min-height:0; margin:2px 10px 0; border-radius:16px; overflow:hidden;
    border:1px solid #3a4470; background:#070a16;
    box-shadow:0 10px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(0,0,0,.5);}
  canvas{display:block; width:100%; height:100%;}
  #banner{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; text-align:center; padding:16px;
  }
  #banner .big{
    font-size:clamp(46px,11vw,98px); font-weight:900; letter-spacing:.05em; line-height:1.05;
    color:#fff; -webkit-text-stroke:1px rgba(0,0,0,.35);
    text-shadow:0 2px 0 #7a5a00, 0 5px 0 rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.65), 0 0 44px rgba(255,197,61,.4);
  }
  #banner .sub{margin-top:12px; font-size:clamp(14px,3.4vw,20px); color:#ffe9a8; font-weight:800; letter-spacing:.18em;
    text-shadow:0 2px 10px rgba(0,0,0,.8); background:rgba(5,7,15,.55); border:1px solid rgba(255,197,61,.35);
    padding:6px 16px; border-radius:99px;}
  #banner .sub:empty{display:none;}
  #banner.hide{opacity:0; transition:opacity .3s;}
  #pauseBtn{
    position:absolute; top:10px; right:10px; width:40px; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,.18);
    background:rgba(13,17,34,.78); backdrop-filter:blur(6px); color:var(--ink); font-size:16px; cursor:pointer; display:none; z-index:5;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  #pauseBtn.on{display:block;}

  /* ---------- Menu overlay ---------- */
  #menu{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:15px; padding:22px 20px; background:linear-gradient(180deg, rgba(7,10,22,.38), rgba(7,10,22,.72) 55%, rgba(5,6,13,.92));
    overflow-y:auto;
  }
  #menu.hide{display:none;}
  #menu h1{margin:0; font-size:clamp(32px,7.5vw,54px); font-weight:900; letter-spacing:.08em; text-align:center; line-height:1.1;
    text-shadow:0 3px 0 rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.7);}
  #menu h1 .accent{color:var(--gold); text-shadow:0 3px 0 #6b4a00, 0 0 26px rgba(255,197,61,.45);}
  #menu p.tag{margin:0; color:#c3cbe6; font-size:13.5px; text-align:center; line-height:1.6; max-width:420px;}
  .menu-btns{display:flex; flex-direction:column; gap:11px; width:100%; max-width:350px;}
  button.act{
    border:1px solid #39436e; background:linear-gradient(180deg,#242d52,#1a2140); color:var(--ink); border-radius:14px;
    padding:15px 17px; font-size:17px; font-weight:800; cursor:pointer; text-align:left;
    display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:inherit;
    box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.09);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button.act small{font-weight:600; color:var(--muted); font-size:12px;}
  button.act.primary{background:linear-gradient(180deg,#ff5d78,var(--red) 45%,var(--red-d)); border-color:rgba(255,255,255,.22); color:#fff;
    box-shadow:0 8px 22px rgba(255,59,92,.35), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.25);}
  button.act.primary small{color:rgba(255,255,255,.82);}
  button.act:active{transform:scale(.975);}
  .diff-row{display:none; gap:8px; width:100%; max-width:350px;}
  .diff-row.on{display:flex;}
  .diff-row button{
    flex:1; padding:11px 4px; border-radius:11px; border:1px solid var(--line); background:linear-gradient(180deg,#1b2242,#141a31);
    color:var(--muted); font-size:14px; font-weight:800; cursor:pointer; font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .diff-row button.sel{background:linear-gradient(180deg,#ffd968,var(--gold)); color:#2a1e00; border-color:#ffe9a8; box-shadow:0 4px 14px rgba(255,197,61,.35);}
  .help{
    width:100%; max-width:560px; background:rgba(13,17,34,.88); border:1px solid var(--line-soft); border-radius:14px;
    padding:13px 15px; font-size:12.5px; line-height:1.8; color:var(--muted);
    box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .help b{color:var(--ink);}
  .help .k{
    display:inline-block; min-width:20px; text-align:center; padding:0 5px; margin:0 1px; border:1px solid #3a4470;
    border-bottom-width:2px; border-radius:5px; background:#0b0f22; color:var(--ink); font-size:11.5px; font-weight:700;
  }

  /* ---------- Touch controls ---------- */
  #controls{display:none; padding:10px 10px calc(12px + env(safe-area-inset-bottom)); gap:10px;}
  #controls.on{display:flex;}
  .pad{flex:1; display:flex; flex-direction:column; gap:7px;}
  .pad.p2{align-items:flex-end;}
  .pad-label{font-size:11px; font-weight:900; letter-spacing:.16em; padding:0 3px; display:flex; align-items:center; gap:6px;}
  .pad-label::before{content:""; width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor;}
  .pad-label.red{color:#ff6b85;} .pad-label.blue{color:#7db1ff;}
  .btn-row{display:flex; gap:7px; width:100%;}
  .tbtn{
    flex:1; min-height:54px; border-radius:14px; border:1px solid #39436e;
    background:linear-gradient(180deg,#263058,#1a2140); color:var(--ink); font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; touch-action:none; line-height:1.15;
    box-shadow:0 5px 0 #0b0f22, 0 8px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
    transition:transform .05s ease, box-shadow .05s ease, background .05s ease;
  }
  .tbtn small{display:block; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.08em;}
  .tbtn:active,.tbtn.held{background:linear-gradient(180deg,#33417a,#27325e); border-color:#55659e; transform:translateY(3px); box-shadow:0 2px 0 #0b0f22, 0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);}
  .tbtn.punch{background:linear-gradient(180deg,#5a2432,#3d1a24);} .tbtn.punch:active,.tbtn.punch.held{background:linear-gradient(180deg,#7d3245,#572634);}
  .tbtn.kickb{background:linear-gradient(180deg,#27436e,#1b2c4c);} .tbtn.kickb:active,.tbtn.kickb.held{background:linear-gradient(180deg,#38609c,#284a80);}
  .tbtn.spec{background:linear-gradient(180deg,#5c4a15,#3d3413); color:#ffe27a; border-color:#7a6420;} .tbtn.spec:active,.tbtn.spec.held{background:linear-gradient(180deg,#7d651f,#574812);}
  .tbtn:disabled{opacity:.35;}
  @media (min-width:760px){ .tbtn{min-height:58px; font-size:16px;} }
  @media (max-height:480px){ .tbtn{min-height:44px;} #hud{padding-top:6px;} }
</style>
</head>
<body>
<div id="app">
  <!-- HUD -->
  <div id="hud">
    <div class="hud-row">
      <div class="side">
        <div class="name"><span style="color:var(--red)">红方</span><span id="name1">拳手</span><span class="pips" id="pips1"><span class="pip"></span><span class="pip"></span></span></div>
        <div class="bar"><div class="ghost" id="ghost1"></div><div class="fill" id="hp1"></div></div>
        <div class="ebar" id="ebar1"><div class="fill" id="en1"></div></div>
      </div>
      <div id="timer"><div class="t" id="timeNum">60</div><div class="l">回合</div></div>
      <div class="side right">
        <div class="name"><span class="pips" id="pips2"><span class="pip"></span><span class="pip"></span></span><span id="name2">对手</span><span style="color:#6ea8ff">蓝方</span></div>
        <div class="bar"><div class="ghost" id="ghost2"></div><div class="fill" id="hp2"></div></div>
        <div class="ebar" id="ebar2"><div class="fill" id="en2"></div></div>
      </div>
    </div>
  </div>

  <!-- Stage -->
  <div id="stage-wrap">
    <canvas id="game"></canvas>
    <button id="pauseBtn" aria-label="暂停">Ⅱ</button>
    <div id="banner" class="hide"><div class="big" id="bannerBig"></div><div class="sub" id="bannerSub"></div></div>

    <!-- Menu -->
    <div id="menu">
      <h1>街机<span class="accent">格斗</span>擂台</h1>
      <p class="tag">拳、脚、格挡、必杀 · 三局两胜 · 气条攒满一半即可放必杀</p>
      <div class="menu-btns">
        <button class="act primary" id="btnSolo">单人战 <small>打电脑 AI</small></button>
        <div class="diff-row" id="diffRow">
          <button data-diff="easy">简单</button>
          <button data-diff="normal" class="sel">普通</button>
          <button data-diff="hard">高手</button>
        </div>
        <button class="act" id="btnVersus">同屏双人 <small>一台手机两个人对打</small></button>
        <button class="act" id="btnRematch" style="display:none">再来一局 <small>相同模式</small></button>
      </div>
      <div class="help">
        <b>手机：</b>下方大按钮操作，左半屏是红方、右半屏是蓝方。<br>
        <b>键盘红方：</b><span class="k">A</span><span class="k">D</span> 移动 · <span class="k">W</span> 跳 · <span class="k">S</span> 格挡 · <span class="k">F</span> 拳 · <span class="k">G</span> 脚 · <span class="k">H</span> 必杀<br>
        <b>键盘蓝方：</b><span class="k">←</span><span class="k">→</span> 移动 · <span class="k">↑</span> 跳 · <span class="k">↓</span> 格挡 · <span class="k">,</span> 拳 · <span class="k">.</span> 脚 · <span class="k">/</span> 必杀<br>
        <b>规则：</b>命中和挨打都能攒气，气条过半按必杀释放冲击波；格挡只受少量伤害。横屏玩更顺手。
      </div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="controls">
    <div class="pad p1">
      <div class="pad-label red">红方 P1</div>
      <div class="btn-row">
        <button class="tbtn" data-p="0" data-k="left">◀<small>左</small></button>
        <button class="tbtn" data-p="0" data-k="right">▶<small>右</small></button>
        <button class="tbtn" data-p="0" data-k="jump">▲<small>跳</small></button>
        <button class="tbtn" data-p="0" data-k="block">🛡<small>挡</small></button>
      </div>
      <div class="btn-row">
        <button class="tbtn punch" data-p="0" data-k="punch">拳</button>
        <button class="tbtn kickb" data-p="0" data-k="kick">脚</button>
        <button class="tbtn spec" data-p="0" data-k="special">必杀</button>
      </div>
    </div>
    <div class="pad p2" id="pad2">
      <div class="pad-label blue">蓝方 P2</div>
      <div class="btn-row">
        <button class="tbtn" data-p="1" data-k="left">◀<small>左</small></button>
        <button class="tbtn" data-p="1" data-k="right">▶<small>右</small></button>
        <button class="tbtn" data-p="1" data-k="jump">▲<small>跳</small></button>
        <button class="tbtn" data-p="1" data-k="block">🛡<small>挡</small></button>
      </div>
      <div class="btn-row">
        <button class="tbtn punch" data-p="1" data-k="punch">拳</button>
        <button class="tbtn kickb" data-p="1" data-k="kick">脚</button>
        <button class="tbtn spec" data-p="1" data-k="special">必杀</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 960, H = 540, FLOOR = 470; // logical stage size
var DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize(){
  var r = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.max(320, Math.floor(r.width * DPR));
  canvas.height = Math.max(200, Math.floor(r.height * DPR));
}
window.addEventListener('resize', resize);

/* ============ Audio (tiny synth, created on first tap) ============ */
var AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function beep(freq, dur, type, vol, slide){
  var ac = audio(); if(!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), ac.currentTime + dur);
  g.gain.setValueAtTime(vol||0.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
function sHit(){ beep(160, .09, 'square', .12, -90); }
function sBlock(){ beep(320, .06, 'triangle', .09, -60); }
function sSwing(){ beep(500, .05, 'sine', .04, -260); }
function sSpec(){ beep(220, .35, 'sawtooth', .1, 500); }
function sKO(){ beep(120, .6, 'sawtooth', .14, -80); beep(60, .7, 'square', .1, -20); }
function sCount(){ beep(660, .1, 'square', .09); }
function sGo(){ beep(990, .22, 'square', .11); }

/* ============ Game state ============ */
var GRAV = 0.9, ROUND_TIME = 60, WIN_ROUNDS = 2;
var state = 'menu'; // menu | intro | fight | roundEnd | matchEnd | paused
var mode = 'solo';   // solo | versus
var difficulty = 'normal';
var round = 1, timer = ROUND_TIME, timerAcc = 0, shake = 0, slowmo = 0;
var lastMode = null;

var ATTACKS = {
  punch:   { dmg:6,  range:64, dur:16, hitAt:6,  rec:8,  push:5,  energy:7,  h:26 },
  kick:    { dmg:9,  range:80, dur:24, hitAt:10, rec:12, push:8,  energy:10, h:20 },
  special: { dmg:16, range:300,dur:34, hitAt:12, rec:20, push:16, energy:0,  h:30 }
};

function makeFighter(x, palette, name){
  return {
    x:x, y:FLOOR, vx:0, vy:0, w:44, h:118, face:1,
    hp:100, energy:0, name:name, palette:palette,
    state:'idle', stateT:0, atk:null, atkHitDone:false,
    blocking:false, hurtT:0, wins:0, walkPhase:0, dead:false,
    input:{left:false,right:false,jump:false,block:false},
    ai:{nextThink:0, plan:'idle', planT:0, react:0}
  };
}
var P1COL = { main:'#ff3b5c', light:'#ff7d94', dark:'#a11e38', deep:'#6e1226', pants:'#232a52', pantsD:'#161c38', skin:'#f6c79b', skinD:'#d99a68', trim:'#ffd9de', hair:'#2b1a22' };
var P2COL = { main:'#2f7bff', light:'#6ea8ff', dark:'#174a9e', deep:'#0f2f66', pants:'#2a2140', pantsD:'#1a142c', skin:'#eebd93', skinD:'#c98d5c', trim:'#d6e6ff', hair:'#141c2e' };
var fighters = [ makeFighter(240, P1COL, '烈拳'), makeFighter(720, P2COL, '疾风') ];
var particles = [], projectiles = [], floaters = [];

function resetPositions(){
  fighters[0].x = 240; fighters[1].x = 720;
  fighters.forEach(function(f,i){
    f.y = FLOOR; f.vx = 0; f.vy = 0; f.hp = 100; f.energy = Math.max(0, f.energy - 20);
    f.state='idle'; f.stateT=0; f.atk=null; f.hurtT=0; f.dead=false; f.face = i===0?1:-1;
    f.input.left=f.input.right=f.input.jump=f.input.block=false;
  });
  projectiles = []; floaters = [];
}
function resetMatch(){
  fighters[0].wins = 0; fighters[1].wins = 0; fighters[0].energy = 0; fighters[1].energy = 0;
  round = 1; resetPositions(); updateHUD();
}

/* ============ HUD ============ */
var el = function(id){ return document.getElementById(id); };
function updateHUD(){
  el('hp1').style.width = Math.max(0, fighters[0].hp) + '%';
  el('hp2').style.width = Math.max(0, fighters[1].hp) + '%';
  el('ghost1').style.width = Math.max(0, fighters[0].hp) + '%';
  el('ghost2').style.width = Math.max(0, fighters[1].hp) + '%';
  el('en1').style.width = fighters[0].energy + '%';
  el('en2').style.width = fighters[1].energy + '%';
  el('ebar1').classList.toggle('full', fighters[0].energy >= 50);
  el('ebar2').classList.toggle('full', fighters[1].energy >= 50);
  el('timeNum').textContent = Math.max(0, Math.ceil(timer));
  el('timer').classList.toggle('low', timer <= 10 && state==='fight');
  [0,1].forEach(function(i){
    var pips = el('pips'+(i+1)).children;
    for(var k=0;k<pips.length;k++) pips[k].classList.toggle('won', k < fighters[i].wins);
  });
  el('name1').textContent = fighters[0].name;

/* ============ Combat ============ */
function startAttack(f, kind){
  if(f.state==='attack' || f.state==='hurt' || f.dead) return;
  if(f.y < FLOOR && kind!=='punch') return;
  if(kind==='special'){
    if(f.energy < 50) { spawnFloater(f.x, f.y - f.h - 34, '气不足', '#9aa5c7'); return; }
    f.energy -= 50; sSpec();
  } else sSwing();
  f.state='attack'; f.stateT=0; f.atk=kind; f.atkHitDone=false; f.blocking=false;
}
function attackBox(f){
  var a = ATTACKS[f.atk];
  var cx = f.x + f.face * (f.w/2 + a.range/2 - 6);
  return { x: cx - a.range/2, y: f.y - 96, w: a.range, h: 56 };
}
function bodyBox(f){ return { x: f.x - f.w/2, y: f.y - f.h, w: f.w, h: f.h }; }
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function dealHit(att, def, kind){
  var a = ATTACKS[kind];
  var blocked = def.blocking && def.y >= FLOOR;
  var dmg = blocked ? Math.max(1, Math.round(a.dmg * 0.15)) : a.dmg;
  def.hp = Math.max(0, def.hp - dmg);
  att.energy = Math.min(100, att.energy + a.energy + 4);
  def.energy = Math.min(100, def.energy + 5);
  def.vx = att.face * a.push * (blocked ? 0.4 : 1);
  if(!blocked){ def.state='hurt'; def.stateT=0; def.hurtT = kind==='kick'?14:10; def.atk=null; }
  shake = Math.min(10, kind==='special'?10:(kind==='kick'?6:4));
  var hx = def.x - att.face*10, hy = def.y - 84;
  spawnParticles(hx, hy, blocked ? '#9fd8ff' : (kind==='special' ? '#ffc53d' : '#ffffff'), blocked?8:14);
  spawnFloater(def.x, def.y - def.h - 26, blocked ? '格挡 -'+dmg : '-'+dmg, blocked ? '#9fd8ff' : '#ffd34d');
  if(blocked) sBlock(); else sHit();
  if(def.hp <= 0 && !def.dead){ def.dead = true; endRound(att, 'K.O.!'); }
  updateHUD();
}
function spawnParticles(x,y,color,n){
  for(var i=0;i<n;i++){
    var isStar = i < Math.max(2, Math.floor(n*0.3));
    particles.push({ x:x, y:y, vx:(Math.random()-0.5)*(isStar?9:7), vy:(Math.random()-0.7)*6,
      life:16+Math.random()*12, max:28, color:color, r:2+Math.random()*3, star:isStar, rot:Math.random()*Math.PI });
  }
  // expanding impact ring
  particles.push({ x:x, y:y, vx:0, vy:0, life:10, max:10, color:color, r:5, star:false, ring:true });
}
function spawnFloater(x,y,text,color){ floaters.push({x:x,y:y,text:text,color:color,life:46}); }

/* ============ AI ============ */
var DIFF = {
  easy:   { think:26, aggro:0.35, block:0.12, specUse:0.3, err:0.35, speed:3.6 },
  normal: { think:16, aggro:0.55, block:0.3,  specUse:0.6, err:0.18, speed:4.1 },
  hard:   { think:9,  aggro:0.75, block:0.52, specUse:0.9, err:0.06, speed:4.6 }
};
function aiControl(f, foe){
  var d = DIFF[difficulty], ai = f.ai, inp = f.input;
  inp.left = inp.right = inp.block = false;
  if(state!=='fight' || f.dead) return;
  // reaction: block incoming attacks
  if(foe.state==='attack' && foe.atk!=='special' && Math.abs(foe.x - f.x) < 130 && Math.random() < d.block){
    inp.block = true; return;
  }
  if(foe.state==='attack' && foe.atk==='special' && Math.random() < d.block + 0.15){
    if(Math.random() < 0.5) inp.block = true; else queuePress(f,'jump');
    return;
  }
  ai.planT--;
  if(ai.planT <= 0){
    ai.planT = d.think + Math.random()*10;
    var dist = Math.abs(foe.x - f.x);
    var r = Math.random();
    if(f.energy >= 50 && dist < 300 && r < d.specUse) ai.plan = 'special';
    else if(dist > 120) ai.plan = r < d.aggro + 0.25 ? 'approach' : 'wait';
    else if(r < 0.62) ai.plan = Math.random()<0.55 ? 'punch' : 'kick';
    else if(r < 0.78) ai.plan = 'retreat';
    else if(r < 0.88) ai.plan = 'jumpIn';
    else ai.plan = 'wait';
    if(Math.random() < d.err) ai.plan = 'wait';
  }
  var toward = foe.x > f.x;
  switch(ai.plan){
    case 'approach': if(toward) inp.right = true; else inp.left = true; break;
    case 'retreat':  if(toward) inp.left = true; else inp.right = true; break;
    case 'jumpIn':   if(toward) inp.right = true; else inp.left = true; queuePress(f,'jump'); ai.plan='approach'; break;
    case 'punch': queuePress(f,'punch'); ai.plan='wait'; break;
    case 'kick': queuePress(f,'kick'); ai.plan='wait'; break;
    case 'special': queuePress(f,'special'); ai.plan='wait'; break;
  }
}
var pressQueue = [[],[]];
function queuePress(f, action){ pressQueue[fighters.indexOf(f)].push(action); }

/* ============ Fighter update ============ */
function updateFighter(f, foe, idx){
  var inp = f.input, d = (mode==='solo' && idx===1) ? DIFF[difficulty] : null;
  var speed = d ? d.speed : 4.3;
  f.face = foe.x >= f.x ? 1 : -1;
  if(f.dead){ f.vx *= 0.8; f.x += f.vx; applyGravity(f); clampStage(f); return; }

  // consume queued presses (AI + tapped buttons behave the same)
  while(pressQueue[idx].length){
    var act = pressQueue[idx].shift();
    if(act==='jump'){ if(f.y >= FLOOR && f.state!=='attack'){ f.vy = -15.5; } }
    else if(act==='punch'||act==='kick'||act==='special'){ if(state==='fight') startAttack(f, act); }
  }

  f.blocking = !!inp.block && f.y >= FLOOR && f.state!=='attack' && f.state!=='hurt';

  if(f.state==='attack'){
    f.stateT++;
    var a = ATTACKS[f.atk];
    if(f.stateT === a.hitAt && !f.atkHitDone){
      f.atkHitDone = true;
      if(f.atk==='special'){
        projectiles.push({ x:f.x + f.face*36, y:f.y-84, vx:f.face*11, owner:idx, life:34, hit:false });
      } else if(overlap(attackBox(f), bodyBox(foe)) && !foe.dead){
        dealHit(f, foe, f.atk);
      }
    }
    if(f.stateT >= a.dur){ f.state='idle'; f.stateT=0; f.atk=null; }
  } else if(f.state==='hurt'){
    f.stateT++; if(f.stateT >= f.hurtT){ f.state='idle'; f.stateT=0; }
  }

  if(f.state!=='attack' && f.state!=='hurt' && !f.blocking){
    if(inp.left)  { f.vx = -speed; f.walkPhase += 0.25; }
    else if(inp.right){ f.vx = speed; f.walkPhase += 0.25; }
    else f.vx *= 0.6;
  } else if(f.state==='hurt' || f.blocking){ /* vx from knockback decays */ f.vx *= 0.82; }
  else f.vx *= 0.7;

  f.x += f.vx;
  applyGravity(f);
  clampStage(f);
  // body push-apart
  var other = foe;
  if(Math.abs(f.x - other.x) < 40 && Math.abs(f.y - other.y) < 60){
    var push = (40 - Math.abs(f.x - other.x)) / 2;
    f.x += (f.x < other.x ? -push : push);
    clampStage(f);
  }
}
function applyGravity(f){
  if(f.y < FLOOR || f.vy < 0){ f.vy += GRAV; f.y += f.vy; if(f.y >= FLOOR){ f.y = FLOOR; f.vy = 0; } }
}
function clampStage(f){ f.x = Math.max(36, Math.min(W-36, f.x)); }

/* ============ Round flow ============ */
function startMatch(m){
  mode = m; lastMode = m; audio();
  el('menu').classList.add('hide');
  el('hud').classList.add('on'); el('controls').classList.add('on'); el('pauseBtn').classList.add('on');
  el('pad2').style.display = (mode==='solo') ? 'none' : 'flex';
  resetMatch();
  startRound();
}
function startRound(){
  resetPositions(); timer = ROUND_TIME; timerAcc = 0;
  state = 'intro'; updateHUD();
  showBanner('第 ' + round + ' 回合', 'ROUND ' + round, 800); sCount();
  setTimeout(function(){ if(state!=='intro') return; showBanner('开打!', 'FIGHT', 600); sGo(); state='fight'; }, 900);
}
function endRound(winner, label){
  if(state==='roundEnd' || state==='matchEnd') return;
  state = 'roundEnd'; sKO();
  winner.wins++; updateHUD();
  var loser = fighters[fighters.indexOf(winner)===0?1:0];
  loser.state = 'hurt';
  if(winner.wins >= WIN_ROUNDS){
    state = 'matchEnd';
    showBanner(label, (winner===fighters[0]?'红方':'蓝方') + ' ' + winner.name + ' 获胜!', Infinity);
    setTimeout(showMenuAfterMatch, 2400);
  } else {
    showBanner(label, (winner===fighters[0]?'红方':'蓝方') + '拿下本回合', 1500);
    round++;
    setTimeout(function(){ if(state==='roundEnd') startRound(); }, 1900);
  }
}
function timeUp(){
  if(fighters[0].hp === fighters[1].hp){
    showBanner('平局', '双方血量相同 · 重赛本回合', 1500);
    state='roundEnd';
    setTimeout(function(){ if(state==='roundEnd') startRound(); }, 1800);
    return;
  }
  endRound(fighters[0].hp > fighters[1].hp ? fighters[0] : fighters[1], '时间到');
}
function showMenuAfterMatch(){
  state='menu';
  el('btnRematch').style.display = 'flex';
  el('menu').classList.remove('hide');
  el('pauseBtn').classList.remove('on');
}
function backToMenu(){
  state='menu'; hideBanner();
  el('menu').classList.remove('hide');
  el('hud').classList.remove('on'); el('controls').classList.remove('on'); el('pauseBtn').classList.remove('on');
  resetMatch();
}

  if(state==='paused'){
    ctx.fillStyle = 'rgba(4,6,14,.6)'; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.fillStyle = '#fff'; ctx.font = '900 54px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.fillText('已暂停', W/2, H/2 - 8);
    ctx.font = '600 17px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle = '#9aa5c7';
    ctx.fillText('点右上角按钮继续', W/2, H/2 + 28);
  }
}

function limb(x1,y1,x2,y2,x3,y3,w1,w2,c1,c2){
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=c1; ctx.lineWidth=w1; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.strokeStyle=c2||c1; ctx.lineWidth=w2; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x3,y3); ctx.stroke();
  ctx.fillStyle=c2||c1; ctx.beginPath(); ctx.arc(x2,y2,w2*0.42,0,Math.PI*2); ctx.fill();
}
function shoe(x,y,face,main){
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  ctx.fillStyle='#f2f3f7'; ctx.beginPath(); ctx.moveTo(-6,-4); ctx.lineTo(9,-4); ctx.quadraticCurveTo(14,-4,14,0); ctx.lineTo(14,2); ctx.lineTo(-6,2); ctx.closePath(); ctx.fill();
  ctx.fillStyle=main; ctx.fillRect(-6,-7,13,4);
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(-2,-6,2,3); ctx.fillRect(3,-6,2,3);
  ctx.restore();
}
function glove(x,y,face,p,r){
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  var g=ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.2,0,0,r*1.25);
  g.addColorStop(0,p.light); g.addColorStop(0.55,p.main); g.addColorStop(1,p.dark);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.38,r*0.34,r*0.2,-0.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(0,0,r-0.8,0.5,2.4); ctx.stroke();
  ctx.fillStyle='#eef1ff'; ctx.fillRect(-r-1,-3,4,6);
  ctx.restore();
}
function drawFighter(f){
  var p = f.palette, t = performance.now()/1000;
  var idle = f.y>=FLOOR && f.state==='idle' && !f.blocking;
  var bob = idle ? Math.sin(t*4.6 + f.x)*1.8 : 0;
  var breathe = idle ? Math.sin(t*4.6 + f.x)*0.7 : 0;
  var baseY = f.y + bob;
  var hurt = f.state==='hurt';
  var flash = hurt && f.stateT < 5;
  var lean = hurt ? -f.face*0.17 : (f.state==='attack' ? f.face*0.07 : (f.blocking ? -f.face*0.04 : 0));
  var air = f.y < FLOOR;
  var moving = Math.abs(f.vx)>0.6 && !air;
  var walk = Math.sin(f.walkPhase);
  var walk2 = Math.cos(f.walkPhase);
  var hipY = -54, shY = -97 + breathe;
  var kicking = f.state==='attack' && f.atk==='kick';
  var ke = kicking ? (f.stateT < ATTACKS.kick.hitAt ? f.stateT/ATTACKS.kick.hitAt : Math.max(0, 1-(f.stateT-ATTACKS.kick.hitAt)/10)) : 0;
  var punching = f.state==='attack' && f.atk==='punch';
  var ext = punching ? (f.stateT < ATTACKS.punch.hitAt ? f.stateT/ATTACKS.punch.hitAt : Math.max(0, 1-(f.stateT-ATTACKS.punch.hitAt)/8)) : 0;

  ctx.save();
  ctx.translate(f.x, baseY);
  // ground shadow: tighter + softer, shrinks in air
  var shScale = 1 - Math.min(0.55, (FLOOR-f.y)/620);
  var shG = ctx.createRadialGradient(0,5,2,0,5,34*shScale);
  shG.addColorStop(0,'rgba(0,0,0,.52)'); shG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shG; ctx.beginPath(); ctx.ellipse(0,5,34*shScale,8*shScale,0,0,Math.PI*2); ctx.fill();
  // ready aura when special is available
  if(f.energy>=50 && !f.dead){
    var au = 0.10 + 0.05*Math.sin(t*6 + f.x);
    var ag = ctx.createRadialGradient(0,-70,8,0,-70,72);
    ag.addColorStop(0,'rgba(255,197,61,'+au+')'); ag.addColorStop(1,'rgba(255,197,61,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(0,-70,72,0,Math.PI*2); ctx.fill();
  }
  ctx.rotate(lean);
  if(f.dead){ ctx.rotate(f.face * 1.32); ctx.translate(0, -8); }

  /* ---- legs with knees (back leg first) ---- */
  var bHipX=-f.face*3, fHipX=f.face*4;
  var bFootX, bFootY, bKneeX, bKneeY, fFootX, fFootY, fKneeX, fKneeY;
  if(air){
    bFootX=-f.face*14; bFootY=-22; bKneeX=-f.face*10; bKneeY=-36;
    fFootX=f.face*16; fFootY=-30; fKneeX=f.face*15; fKneeY=-42;
  } else if(moving){
    bFootX=-walk*13 - f.face*2; bFootY = walk2>0 ? -3 : 0; bKneeX=bFootX*0.45 + f.face*3; bKneeY=-27;
    fFootX= walk*13 + f.face*3; fFootY = walk2<0 ? -3 : 0; fKneeX=fFootX*0.45 + f.face*5; fKneeY=-27;
  } else {
    bFootX=-f.face*11; bFootY=0; bKneeX=-f.face*7; bKneeY=-28;
    fFootX= f.face*13; fFootY=0; fKneeX= f.face*10; fKneeY=-28;
  }
  if(kicking){ // front leg becomes the kick; back leg plants
    bFootX=-f.face*9; bFootY=0; bKneeX=-f.face*5; bKneeY=-28;
  }
  limb(bHipX,hipY, bKneeX,bKneeY, bFootX,bFootY-3, 12, 9, p.pantsD, p.pantsD);
  shoe(bFootX, bFootY-1, f.face, p.dark);
  if(!kicking){
    limb(fHipX,hipY, fKneeX,fKneeY, fFootX,fFootY-3, 12, 9, p.pants, p.pants);
    shoe(fFootX, fFootY-1, f.face, p.main);
  }
  // shorts
  ctx.fillStyle=p.pants; ctx.beginPath();
  ctx.moveTo(-14,hipY-9); ctx.lineTo(14,hipY-9); ctx.lineTo(12,hipY+7); ctx.lineTo(-11,hipY+7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.13)'; ctx.fillRect(-14,hipY-9,28,3);
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; ctx.strokeRect(-14,hipY-9,28,16);

  /* ---- torso: tapered vest with shading, chest + fold lines ---- */
  var grd = ctx.createLinearGradient(-16,0,16,0);
  grd.addColorStop(0, p.dark); grd.addColorStop(0.38, p.main); grd.addColorStop(0.72, p.light); grd.addColorStop(1, p.dark);
  if(flash){ grd = ctx.createLinearGradient(0,-106,0,-44); grd.addColorStop(0,'#ffffff'); grd.addColorStop(1,'#ffb3c0'); }
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(-16,shY-7); ctx.quadraticCurveTo(0,shY-11,16,shY-7);
  ctx.lineTo(13,hipY-6); ctx.quadraticCurveTo(0,hipY-2,-13,hipY-6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=1.2; ctx.stroke();
  // centre placket + chest shading
  ctx.strokeStyle='rgba(0,0,0,.20)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(f.face*2, shY-5); ctx.quadraticCurveTo(f.face*4, -74, f.face*1, hipY-8); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.20)';
  ctx.beginPath(); ctx.moveTo(-11, shY+8); ctx.quadraticCurveTo(0, shY+13, 11, shY+8); ctx.stroke();
  // belt with buckle
  var beltG = ctx.createLinearGradient(0,hipY-9,0,hipY-1);
  beltG.addColorStop(0,'#ffe27a'); beltG.addColorStop(0.5,'#ffc53d'); beltG.addColorStop(1,'#c78f0c');
  ctx.fillStyle=beltG; ctx.fillRect(-14,hipY-9,28,7);
  ctx.fillStyle='#fff3b0'; ctx.fillRect(-5,hipY-8,10,5);
  ctx.strokeStyle='#8a6508'; ctx.lineWidth=1; ctx.strokeRect(-5,hipY-8,10,5);

  /* ---- back arm ---- */
  var bShX=-f.face*12;
  if(f.blocking){
    limb(bShX,shY, -f.face*3,shY+15, f.face*7,shY+9, 10, 8, p.dark, p.skinD);
    glove(f.face*9, shY+8, f.face, p, 8.5);
  } else if(hurt){
    limb(bShX,shY, -f.face*22,shY+10, -f.face*26,shY+26, 10, 8, p.dark, p.skinD);
    glove(-f.face*27, shY+28, f.face, p, 8.5);
  } else {
    var bSw = idle ? Math.sin(t*4.6 + f.x)*1.6 : 0;
    limb(bShX,shY, -f.face*18,shY+14+bSw, -f.face*13,shY+27+bSw, 10, 8, p.dark, p.skinD);
    glove(-f.face*12, shY+29+bSw, f.face, p, 8.5);
  }

  /* ---- head: face profile, hair spikes, headband tails ---- */
  var headY=-121+breathe, hx=f.face*2;
  // neck
  ctx.fillStyle=p.skinD; ctx.fillRect(hx-5, headY+8, 10, 9);
  // face base with jaw
  var skinG = ctx.createRadialGradient(hx+f.face*3, headY-4, 3, hx, headY, 17);
  skinG.addColorStop(0, flash?'#fff':p.skin); skinG.addColorStop(1, flash?'#ffd7de':p.skinD);
  ctx.fillStyle=skinG;
  ctx.beginPath();
  ctx.arc(hx, headY, 14.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+f.face*2, headY+9); ctx.quadraticCurveTo(hx+f.face*10, headY+10, hx+f.face*11, headY+3); ctx.lineTo(hx+f.face*11, headY+13); ctx.lineTo(hx+f.face*1, headY+13); ctx.closePath(); ctx.fill();
  // ear
  ctx.fillStyle=p.skinD; ctx.beginPath(); ctx.arc(hx-f.face*10, headY+1, 3.4, 0, Math.PI*2); ctx.fill();
  // hair spikes on top/back
  ctx.fillStyle=p.hair;
  ctx.beginPath();
  ctx.moveTo(hx-13, headY-4);
  ctx.lineTo(hx-12, headY-14); ctx.lineTo(hx-6, headY-10);
  ctx.lineTo(hx-3, headY-17); ctx.lineTo(hx+2, headY-11);
  ctx.lineTo(hx+6, headY-16); ctx.lineTo(hx+9, headY-9);
  ctx.lineTo(hx+13, headY-11); ctx.lineTo(hx+12, headY-2);
  ctx.quadraticCurveTo(hx, headY-8, hx-13, headY-4); ctx.closePath(); ctx.fill();
  // headband + flowing tails
  var bandG = ctx.createLinearGradient(hx-14,0,hx+14,0);
  bandG.addColorStop(0,p.dark); bandG.addColorStop(0.5,p.light); bandG.addColorStop(1,p.main);
  ctx.fillStyle=bandG; ctx.fillRect(hx-14, headY-8, 28, 5.5);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(hx-14, headY-8, 28, 1.6);
  var tailSway = Math.sin(t*5.2 + f.x)*2.4 + (moving ? -f.face*2 : 0);
  ctx.strokeStyle=p.main; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(hx-f.face*13, headY-5);
  ctx.quadraticCurveTo(hx-f.face*21, headY-3+tailSway, hx-f.face*25, headY+4+tailSway*1.4); ctx.stroke();
  ctx.strokeStyle=p.light; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx-f.face*13, headY-6);
  ctx.quadraticCurveTo(hx-f.face*20, headY-5+tailSway, hx-f.face*23, headY+1+tailSway*1.3); ctx.stroke();
  // brow / eye / nose / mouth — expression changes with state
  ctx.strokeStyle='#221722'; ctx.lineCap='round';
  ctx.lineWidth=2.2; ctx.beginPath();
  ctx.moveTo(hx+f.face*3, headY-3.5); ctx.lineTo(hx+f.face*10, hurt ? headY-1.5 : headY-2.6); ctx.stroke();
  ctx.fillStyle='#17101a';
  if(hurt && f.stateT<16){ // squeezed-shut eye when hurt
    ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(hx+f.face*4, headY+0.5); ctx.lineTo(hx+f.face*9, headY+0.5); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(hx+f.face*6.5, headY+0.5, 1.9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(hx+f.face*7.1, headY-0.1, 0.6, 0, Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='rgba(90,50,25,.55)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(hx+f.face*11, headY+2); ctx.lineTo(hx+f.face*9.5, headY+5); ctx.stroke();
  ctx.strokeStyle='#5a2c20'; ctx.lineWidth=1.8; ctx.beginPath();
  if(hurt) { ctx.arc(hx+f.face*7, headY+10, 2.2, Math.PI*1.05, Math.PI*1.95); }
  else if(f.state==='attack') { ctx.moveTo(hx+f.face*4, headY+9); ctx.lineTo(hx+f.face*10, headY+9); }
  else { ctx.moveTo(hx+f.face*5, headY+9.5); ctx.quadraticCurveTo(hx+f.face*7.5, headY+10.6, hx+f.face*10, headY+9.5); }
  ctx.stroke();

  /* ---- front arm + glove ---- */
  var fShX=f.face*12;
  if(punching){
    // motion trail
    ctx.save(); ctx.globalAlpha=0.20; ctx.strokeStyle=p.light; ctx.lineWidth=13; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(fShX, shY+3); ctx.lineTo(f.face*(30+30*ext), shY+3); ctx.stroke(); ctx.restore();
    limb(fShX,shY, f.face*(22+26*ext),shY+3, f.face*(32+34*ext),shY+3, 10.5, 8.5, p.main, p.skinD);
    glove(f.face*(36+36*ext), shY+3, f.face, p, 9.5);
  } else if(f.state==='attack' && f.atk==='special'){
    limb(fShX,shY, f.face*24,shY+8, f.face*33,shY+5, 10.5, 8.5, p.main, p.skinD);
    glove(f.face*36, shY+5, f.face, p, 9.5);
    ctx.save(); ctx.globalAlpha=0.25+0.12*Math.sin(t*18); ctx.fillStyle='#ffc53d';
    ctx.beginPath(); ctx.arc(f.face*40, shY+5, 9, 0, Math.PI*2); ctx.fill(); ctx.restore();
  } else if(f.blocking){
    limb(fShX,shY, f.face*18,shY+15, f.face*15,shY-4, 10.5, 8.5, p.main, p.skinD);
    glove(f.face*15, shY-7, f.face, p, 9);
  } else if(hurt){
    limb(fShX,shY, f.face*20,shY+12, f.face*16,shY+28, 10.5, 8.5, p.main, p.skinD);
    glove(f.face*15, shY+30, f.face, p, 9);
  } else {
    var fSw = idle ? Math.sin(t*4.6 + f.x + 0.7)*1.5 : 0;
    limb(fShX,shY, f.face*21,shY+13+fSw, f.face*17,shY+25+fSw, 10.5, 8.5, p.main, p.skinD);
    glove(f.face*17, shY+27+fSw, f.face, p, 9);
  }

  /* ---- kick leg on top, with arc trail ---- */
  if(kicking){
    ctx.save(); ctx.globalAlpha=0.18*ke; ctx.strokeStyle='#ffffff'; ctx.lineWidth=15; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,hipY); ctx.quadraticCurveTo(f.face*36,-78, f.face*(24+54*ke),-60); ctx.stroke(); ctx.restore();
    limb(fHipX,hipY, f.face*(16+26*ke),-72, f.face*(24+56*ke),-59, 12, 9, p.pants, p.pants);
    shoe(f.face*(28+58*ke), -57, f.face, p.main);
  }
  // block shield: layered hex-arc with shimmer
  if(f.blocking){
    var shimmer = 0.75 + 0.2*Math.sin(t*7);
    ctx.save(); ctx.translate(f.face*22, -78);
    ctx.strokeStyle='rgba(140,200,255,'+(0.28*shimmer)+')'; ctx.lineWidth=11;
    ctx.beginPath(); ctx.arc(0,0,35,-1.15,1.15); ctx.stroke();
    ctx.strokeStyle='rgba(170,220,255,'+(0.9*shimmer)+')'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(0,0,35,-1.15,1.15); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(0,0,29,-0.7,0.5); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  // name tag: pill badge instead of floating plain text
  ctx.save();
  ctx.font = '800 11.5px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  var nw = ctx.measureText(f.name).width + 18;
  var nx = f.x - nw/2, ny = f.y - f.h - 40 + bob;
  ctx.fillStyle='rgba(6,8,18,.62)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(nx, ny, nw, 17, 8); else ctx.rect(nx, ny, nw, 17);
  ctx.fill();
  ctx.strokeStyle = f===fighters[0] ? 'rgba(255,93,120,.55)' : 'rgba(110,168,255,.55)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='rgba(242,244,255,.92)';
  ctx.fillText(f.name, f.x, ny + 12.5);
  ctx.restore();
}

/* ============ Main loop ============ */
var lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt = Math.min(50, ts - lastTs); lastTs = ts;
  if(state==='fight'){
    if(mode==='solo') aiControl(fighters[1], fighters[0]);
    updateFighter(fighters[0], fighters[1], 0);
    updateFighter(fighters[1], fighters[0], 1);
    // projectiles
    for(var i=projectiles.length-1;i>=0;i--){
      var p = projectiles[i]; p.x += p.vx; p.life--;
      var foe = fighters[p.owner===0?1:0], att = fighters[p.owner];
      if(!p.hit && !foe.dead && overlap({x:p.x-14,y:p.y-14,w:28,h:28}, bodyBox(foe))){
        p.hit = true; dealHit(att, foe, 'special'); p.life = 0;
      }
      if(p.life<=0 || p.x < -30 || p.x > W+30) projectiles.splice(i,1);
    }
    timerAcc += dt;
    if(timerAcc >= 1000){ timerAcc -= 1000; timer -= 1; el('timeNum').textContent = Math.max(0, Math.ceil(timer)); el('timer').classList.toggle('low', timer<=10); if(timer<=0){ timer=0; timeUp(); } }
  } else if(state==='intro' || state==='roundEnd' || state==='matchEnd' || state==='menu'){
    fighters.forEach(function(f){ f.walkPhase += 0.02; });
  }
  draw();
}
resize();
requestAnimationFrame(function(ts){ resize(); requestAnimationFrame(loop); });

/* ============ Input: keyboard ============ */
var KEYMAP = [
  { left:'KeyA', right:'KeyD', jump:'KeyW', block:'KeyS', punch:'KeyF', kick:'KeyG', special:'KeyH' },
  { left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp', block:'ArrowDown', punch:'Comma', kick:'Period', special:'Slash' }
];
var codeTo = {};
KEYMAP.forEach(function(m, idx){ Object.keys(m).forEach(function(k){ codeTo[m[k]] = { p: idx, k: k }; }); });
window.addEventListener('keydown', function(e){
  var m = codeTo[e.code]; if(!m) return;
  e.preventDefault(); audio();
  var f = fighters[m.p];
  if(m.k==='left'||m.k==='right'||m.k==='block') f.input[m.k] = true;
  else if(!e.repeat) queuePress(f, m.k);
});
window.addEventListener('keyup', function(e){
  var m = codeTo[e.code]; if(!m) return;
  var f = fighters[m.p];
  if(m.k==='left'||m.k==='right'||m.k==='block') f.input[m.k] = false;
});

/* ============ Input: touch buttons ============ */
document.querySelectorAll('.tbtn').forEach(function(btn){
  var p = +btn.getAttribute('data-p'), k = btn.getAttribute('data-k');
  function down(e){ e.preventDefault(); audio(); btn.classList.add('held');
    if(k==='left'||k==='right'||k==='block') fighters[p].input[k] = true;
    else queuePress(fighters[p], k);
  }
  function up(e){ if(e) e.preventDefault(); btn.classList.remove('held');
    if(k==='left'||k==='right'||k==='block') fighters[p].input[k] = false;
  }
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
});

/* ============ Menu wiring ============ */
el('btnSolo').addEventListener('click', function(){ audio(); el('diffRow').classList.toggle('on'); });
document.querySelectorAll('#diffRow button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#diffRow button').forEach(function(x){ x.classList.remove('sel'); });
    b.classList.add('sel'); difficulty = b.getAttribute('data-diff');
    startMatch('solo');
  });
});
el('btnVersus').addEventListener('click', function(){ startMatch('versus'); });
el('btnRematch').addEventListener('click', function(){ if(lastMode) startMatch(lastMode); });
el('pauseBtn').addEventListener('click', function(){
  if(state==='fight' || state==='intro'){ state='paused'; el('pauseBtn').textContent='▶'; showBanner('已暂停','', Infinity); }
  else if(state==='paused'){ state='fight'; el('pauseBtn').textContent='Ⅱ'; hideBanner(); }
});
// long-press stage = back to menu (from pause)
el('banner').addEventListener('click', function(){});
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
var stageWrap = el('stage-wrap');
var pressTimer = null;
stageWrap.addEventListener('pointerdown', function(){
  if(state==='paused'){ pressTimer = setTimeout(function(){ el('pauseBtn').textContent='Ⅱ'; backToMenu(); }, 700); }
});
stageWrap.addEventListener('pointerup', function(){ if(pressTimer) clearTimeout(pressTimer); });
document.addEventListener('visibilitychange', function(){
  if(document.hidden && state==='fight'){ state='paused'; el('pauseBtn').textContent='▶'; }
});

updateHUD();
})();
</script>
